<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Questy, the Ask Quest helper">
  <defs>
    <radialGradient id="qFace" cx="45%" cy="38%" r="65%">
      <stop offset="0" stop-color="#9BE3F7"/>
      <stop offset="1" stop-color="#4EC8EB"/>
    </radialGradient>
    <linearGradient id="qBow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7EB3"/>
      <stop offset="1" stop-color="#E84D8A"/>
    </linearGradient>
  </defs>
  <!-- antenna with a little idea bulb -->
  <path d="M60 22 V10" stroke="#002F6C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="9" r="6" fill="#FFD54A" stroke="#002F6C" stroke-width="2.5"/>
  <path d="M53 4 l-3 -3 M67 4 l3 -3 M60 1 v-1" stroke="#FFC107" stroke-width="2" stroke-linecap="round"/>
  <!-- ears / headset -->
  <rect x="9" y="52" width="12" height="24" rx="6" fill="#002F6C"/>
  <rect x="99" y="52" width="12" height="24" rx="6" fill="#002F6C"/>
  <!-- head -->
  <rect x="16" y="22" width="88" height="82" rx="38" fill="url(#qFace)" stroke="#002F6C" stroke-width="4"/>
  <!-- bow -->
  <g transform="translate(84 30) rotate(18)">
    <path d="M0 0 L-15 -10 Q-19 0 -15 10 Z" fill="url(#qBow)" stroke="#002F6C" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0 0 L15 -10 Q19 0 15 10 Z" fill="url(#qBow)" stroke="#002F6C" stroke-width="2.5" stroke-linejoin="round"/>
    <circle r="4.5" fill="#FF7EB3" stroke="#002F6C" stroke-width="2.5"/>
  </g>
  <!-- face screen -->
  <rect x="27" y="40" width="66" height="52" rx="24" fill="#FFFFFF"/>
  <!-- eyes with sparkles and lashes -->
  <ellipse cx="46" cy="61" rx="7" ry="9" fill="#002F6C"/>
  <ellipse cx="74" cy="61" rx="7" ry="9" fill="#002F6C"/>
  <circle cx="48.5" cy="57.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="76.5" cy="57.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="44" cy="64.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="72" cy="64.5" r="1.3" fill="#FFFFFF"/>
  <path d="M38 54 l-4 -3 M40 51 l-2 -4" stroke="#002F6C" stroke-width="2" stroke-linecap="round"/>
  <path d="M82 54 l4 -3 M80 51 l2 -4" stroke="#002F6C" stroke-width="2" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <ellipse cx="36" cy="75" rx="6" ry="3.5" fill="#FF9EC4" opacity=".75"/>
  <ellipse cx="84" cy="75" rx="6" ry="3.5" fill="#FF9EC4" opacity=".75"/>
  <!-- big happy smile -->
  <path d="M50 74 Q60 86 70 74 Z" fill="#E84D8A" stroke="#002F6C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M55 79 Q60 83 65 79" fill="#FF9EC4"/>
  <!-- waving hand -->
  <g transform="translate(104 92) rotate(-20)">
    <rect x="-7" y="-12" width="14" height="18" rx="7" fill="#9BE3F7" stroke="#002F6C" stroke-width="3"/>
  </g>
  <path d="M110 76 q4 -3 6 1 M112 70 q5 -2 6 3" stroke="#4EC8EB" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
